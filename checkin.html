<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

  <title>학생 등원</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        sans-serif;

      margin: 0;
      padding: 30px 20px;
      text-align: center;
      background: #f7f7f7;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    #guide {
      font-size: 19px;
      margin-bottom: 20px;
    }

    #readerWrap {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      min-height: 340px;
    }

    #reader {
      width: 100%;
      min-height: 340px;
      background: #000;
    }

    #reader video {
      display: block !important;
      width: 100% !important;
      height: 340px !important;
      object-fit: cover !important;
      background: #000;
    }

    #cameraMessage {
      position: absolute;
      left: 15px;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 18px;
      z-index: 2;
      pointer-events: none;
    }

    #restartButton {
      display: none;
      margin: 18px auto 0;
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 18px;
    }

    #result {
      display: none;
      max-width: 450px;
      margin: 25px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 18px;
    }

    #name {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #status {
      font-size: 25px;
      font-weight: bold;
    }

    #time {
      margin-top: 12px;
      font-size: 19px;
    }

    .duplicate {
      font-size: 23px;
    }

    .error {
      font-size: 22px;
      color: #b00020;
    }
  </style>
</head>


<body>

  <h1>등원</h1>

  <div id="guide">
    학생 QR을 보여주세요.
  </div>

  <div id="readerWrap">

    <div id="cameraMessage">
      카메라를 실행하는 중입니다.
    </div>

    <div id="reader"></div>

  </div>

  <button id="restartButton" onclick="restartCamera()">
    카메라 다시 켜기
  </button>


  <div id="result">

    <div id="name"></div>

    <div id="status"></div>

    <div id="time"></div>

  </div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyx8L6wf-PMZMQYBd1_ViAUiJ65ByHW4N7_Sq2ItXKbFSOW69MpV6boP81GX_wuiKnt5A/exec";


let locked = false;

let html5QrCode = null;

let cameraRunning = false;



async function onScanSuccess(decodedText) {

  if (locked) return;

  locked = true;


  const code =
    decodedText.trim().toUpperCase();


  const result =
    document.getElementById("result");

  const name =
    document.getElementById("name");

  const status =
    document.getElementById("status");

  const time =
    document.getElementById("time");


  result.style.display = "block";

  name.innerText = "확인 중...";

  status.className = "";

  status.innerText = "";

  time.innerText = "";


  try {

    const response = await fetch(

      API_URL +
      "?action=checkin&code=" +
      encodeURIComponent(code),

      {
        cache: "no-store"
      }

    );


    const data =
      await response.json();


    if (!data.success) {

      name.innerText = "";

      status.className = "error";

      status.innerText =
        data.message || "등록되지 않은 QR입니다.";

    }

    else if (data.duplicate) {

      name.innerText =
        data.name;

      status.className =
        "duplicate";

      status.innerText =
        "이미 오늘 등원했습니다.";

      time.innerText =
        "등원시간 " + data.time;

    }

    else {

      name.innerText =
        data.name;

      status.className = "";

      status.innerText =
        "✓ 등원 완료";

      time.innerText =
        data.time;

    }

  }

  catch (error) {

    console.error(error);

    name.innerText = "";

    status.className = "error";

    status.innerText =
      "등원 처리에 실패했습니다.";

  }


  setTimeout(function() {

    locked = false;

    result.style.display = "none";

    name.innerText = "";

    status.innerText = "";

    time.innerText = "";

  }, 4000);

}



async function startCamera() {

  const message =
    document.getElementById("cameraMessage");

  const restartButton =
    document.getElementById("restartButton");


  restartButton.style.display = "none";

  message.style.display = "block";

  message.innerText =
    "카메라를 실행하는 중입니다.";


  try {

    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode("reader");

    }


    if (cameraRunning) {

      try {

        await html5QrCode.stop();

      }

      catch (e) {
      }

      cameraRunning = false;

    }


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(
              Math.min(
                260,
                viewfinderWidth * 0.7,
                viewfinderHeight * 0.7
              )
            );


          return {
            width: size,
            height: size
          };

        }
      },

      onScanSuccess,

      function() {
      }

    );


    cameraRunning = true;

    message.style.display = "none";


    setTimeout(function() {

      const video =
        document.querySelector(
          "#reader video"
        );


      if (video) {

        video.setAttribute(
          "playsinline",
          "true"
        );

        video.setAttribute(
          "webkit-playsinline",
          "true"
        );

        video.muted = true;

        video.autoplay = true;


        video.play().catch(function(error) {

          console.log(
            "video play error",
            error
          );

        });

      }

    }, 400);

  }

  catch (error) {

    console.error(
      "카메라 실행 오류",
      error
    );


    cameraRunning = false;

    message.style.display = "block";

    message.innerText =
      "카메라를 열지 못했습니다.\n카메라 권한을 확인해주세요.";

    restartButton.style.display =
      "block";

  }

}



async function restartCamera() {

  try {

    if (
      html5QrCode &&
      cameraRunning
    ) {

      await html5QrCode.stop();

    }

  }

  catch (e) {
  }


  cameraRunning = false;


  setTimeout(function() {

    startCamera();

  }, 500);

}



window.addEventListener(
  "load",
  function() {

    setTimeout(function() {

      startCamera();

    }, 500);

  }
);



document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible"
    ) {

      setTimeout(function() {

        const video =
          document.querySelector(
            "#reader video"
          );


        if (!video) {

          restartCamera();

          return;

        }


        if (
          video.readyState < 2 ||
          video.paused
        ) {

          video.play().catch(function() {

            restartCamera();

          });

        }

      }, 700);

    }

  }
);



window.addEventListener(
  "pageshow",
  function(event) {

    if (event.persisted) {

      setTimeout(function() {

        restartCamera();

      }, 500);

    }

  }
);

</script>

</body>
</html>
