<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

  <title>학생 등원</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        sans-serif;

      margin: 0;
      padding: 30px 20px;
      text-align: center;
      background: #f7f7f7;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 8px;
    }

    #guide {
      font-size: 19px;
      margin-bottom: 20px;
    }

    #cameraBox {
      width: 100%;
      max-width: 500px;
      height: 360px;
      margin: 0 auto;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
    }

    #reader {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #reader video {
      width: 100% !important;
      height: 360px !important;
      object-fit: cover !important;
      display: block !important;
    }

    #cameraMessage {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: white;
      font-size: 18px;
      z-index: 10;
      pointer-events: none;
    }

    #restartButton {
      display: none;
      margin: 18px auto 0;
      padding: 14px 22px;
      border: none;
      border-radius: 12px;
      background: #222;
      color: white;
      font-size: 18px;
    }

    #result {
      display: none;
      max-width: 450px;
      margin: 25px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 18px;
    }

    #name {
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #status {
      font-size: 25px;
      font-weight: bold;
    }

    #time {
      margin-top: 12px;
      font-size: 19px;
    }

    .duplicate {
      font-size: 23px;
    }

    .error {
      font-size: 22px;
      color: #b00020;
    }
  </style>
</head>

<body>

  <h1>등원</h1>

  <div id="guide">
    학생 QR을 보여주세요.
  </div>

  <div id="cameraBox">

    <div id="cameraMessage">
      카메라를 실행하는 중입니다.
    </div>

    <div id="reader"></div>

  </div>

  <button id="restartButton" onclick="restartCamera()">
    카메라 다시 켜기
  </button>

  <div id="result">
    <div id="name"></div>
    <div id="status"></div>
    <div id="time"></div>
  </div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyx8L6wf-PMZMQYBd1_ViAUiJ65ByHW4N7_Sq2ItXKbFSOW69MpV6boP81GX_wuiKnt5A/exec";


let locked = false;
let html5QrCode = null;
let cameraRunning = false;



async function onScanSuccess(decodedText) {

  if (locked) return;

  locked = true;

  const code =
    decodedText.trim().toUpperCase();

  const result =
    document.getElementById("result");

  const name =
    document.getElementById("name");

  const status =
    document.getElementById("status");

  const time =
    document.getElementById("time");


  result.style.display = "block";

  name.innerText = "확인 중...";
  status.className = "";
  status.innerText = "";
  time.innerText = "";


  try {

    const response =
      await fetch(

        API_URL +
        "?action=checkin&code=" +
        encodeURIComponent(code),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    if (!data.success) {

      name.innerText = "";

      status.className = "error";

      status.innerText =
        data.message || "등록되지 않은 QR입니다.";

    }

    else if (data.duplicate) {

      name.innerText =
        data.name;

      status.className =
        "duplicate";

      status.innerText =
        "이미 오늘 등원했습니다.";

      time.innerText =
        "등원시간 " + data.time;

    }

    else {

      name.innerText =
        data.name;

      status.className = "";

      status.innerText =
        "✓ 등원 완료";

      time.innerText =
        data.time;

    }

  }

  catch (error) {

    console.error(error);

    name.innerText = "";

    status.className = "error";

    status.innerText =
      "등원 처리에 실패했습니다.";

  }


  setTimeout(function() {

    locked = false;

    result.style.display = "none";

    name.innerText = "";
    status.innerText = "";
    time.innerText = "";

  }, 4000);

}



async function startCamera() {

  const cameraMessage =
    document.getElementById("cameraMessage");

  const restartButton =
    document.getElementById("restartButton");


  cameraMessage.style.display = "block";

  cameraMessage.innerText =
    "카메라를 실행하는 중입니다.";

  restartButton.style.display = "none";


  try {

    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode("reader");

    }


    await html5QrCode.start(

      {
        facingMode: {
          exact: "environment"
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 240,
          height: 240
        },

        disableFlip: false
      },

      onScanSuccess,

      function() {
      }

    );


    cameraRunning = true;

    cameraMessage.style.display =
      "none";


    setTimeout(function() {

      const video =
        document.querySelector(
          "#reader video"
        );

      if (video) {

        video.setAttribute(
          "playsinline",
          ""
        );

        video.setAttribute(
          "webkit-playsinline",
          ""
        );

        video.muted = true;

        video.autoplay = true;

        video.play().catch(function() {
        });

      }

    }, 300);

  }

  catch (error) {

    console.error(
      "카메라 오류:",
      error
    );


    /*
      일부 아이폰은 exact environment
      조건을 거부할 수 있어서
      ideal 방식으로 한 번 더 시도
    */

    try {

      await html5QrCode.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 240,
            height: 240
          }
        },

        onScanSuccess,

        function() {
        }

      );


      cameraRunning = true;

      cameraMessage.style.display =
        "none";

    }

    catch (secondError) {

      console.error(
        "두 번째 카메라 오류:",
        secondError
      );

      cameraRunning = false;

      cameraMessage.style.display =
        "block";

      cameraMessage.innerText =
        "카메라를 열 수 없습니다.\nSafari의 카메라 권한을 확인해주세요.";

      restartButton.style.display =
        "block";

    }

  }

}



async function restartCamera() {

  try {

    if (
      html5QrCode &&
      cameraRunning
    ) {

      await html5QrCode.stop();

    }

  }

  catch (error) {
  }


  cameraRunning = false;


  setTimeout(function() {

    startCamera();

  }, 500);

}



window.addEventListener(
  "load",
  function() {

    setTimeout(function() {

      startCamera();

    }, 400);

  }
);



document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible"
    ) {

      setTimeout(function() {

        const video =
          document.querySelector(
            "#reader video"
          );


        if (!video) {

          restartCamera();

          return;

        }


        video.play().catch(function() {

          restartCamera();

        });

      }, 600);

    }

  }
);

</script>

</body>
</html>
