<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

  <title>도서대출 · 하원</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        sans-serif;

      margin: 0;
      padding: 25px 18px;

      text-align: center;

      background: #f7f7f7;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 8px;
    }

    #guide {
      font-size: 19px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* 카메라 */

    #cameraBox {
      width: 100%;
      max-width: 500px;
      height: 360px;

      margin: 0 auto;

      position: relative;

      background: #000;

      border-radius: 18px;

      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #reader video {
      width: 100% !important;
      height: 360px !important;

      object-fit: cover !important;

      display: block !important;

      background: #000;
    }

    #cameraMessage {
      position: absolute;

      top: 50%;
      left: 20px;
      right: 20px;

      transform: translateY(-50%);

      color: white;

      font-size: 18px;

      z-index: 10;

      pointer-events: none;

      white-space: pre-line;
    }

    #restartButton {
      display: none;

      max-width: 500px;

      margin: 15px auto;

      background: #222;
      color: white;
    }


    /* 카드 */

    .box {
      display: none;

      max-width: 450px;

      margin: 24px auto;

      padding: 28px 20px;

      background: white;

      border-radius: 18px;
    }

    #studentName,
    #resultName {
      font-size: 36px;
      font-weight: bold;

      margin-bottom: 15px;
    }

    #status {
      font-size: 24px;
      font-weight: bold;

      margin-bottom: 15px;
    }

    #bookList {
      font-size: 19px;
      line-height: 1.7;

      margin: 18px 0;

      text-align: left;
    }

    #resultTime {
      font-size: 19px;
      margin-top: 12px;
    }


    /* 버튼 */

    button {
      display: block;

      width: 100%;

      padding: 18px;

      margin: 12px 0;

      border: none;
      border-radius: 14px;

      font-size: 22px;
      font-weight: bold;

      cursor: pointer;
    }

    #moreBorrowButton {
      background: #e8f1ff;
    }

    #finishBorrowButton {
      background: #ededed;
    }

    #yesCheckoutButton {
      background: #222;
      color: white;
    }

    #noCheckoutButton {
      background: #ededed;
    }

    .error {
      color: #b00020;
    }

  </style>
</head>


<body>

<h1 id="pageTitle">
  도서대출
</h1>

<div id="guide">
  학생 QR을 보여주세요.
</div>


<div id="cameraBox">

  <div id="cameraMessage">
    카메라를 실행하는 중입니다.
  </div>

  <div id="reader"></div>

</div>


<button id="restartButton"
        onclick="restartCamera()">
  카메라 다시 켜기
</button>



<!-- 책 대출 결과 -->

<div id="borrowResult"
     class="box">

  <div id="studentName"></div>

  <div id="status"></div>

  <div id="bookList"></div>

  <button id="moreBorrowButton"
          onclick="borrowMore()">

    📚 더 대출하기

  </button>

  <button id="finishBorrowButton"
          onclick="finishBorrow()">

    ✅ 대출 완료

  </button>

</div>



<!-- 하원 확인 -->

<div id="checkoutConfirm"
     class="box">

  <div id="resultName"></div>

  <div style="
      font-size:24px;
      font-weight:bold;
      margin-bottom:20px;
  ">
    하원하시겠습니까?
  </div>

  <div id="confirmBookList"
       style="
       font-size:19px;
       line-height:1.7;
       text-align:left;
       margin-bottom:22px;
       ">
  </div>

  <button id="yesCheckoutButton"
          onclick="checkoutStudent()">

    네, 하원합니다

  </button>

  <button id="noCheckoutButton"
          onclick="borrowMore()">

    아니요, 책을 더 빌릴게요

  </button>

</div>



<!-- 최종 결과 -->

<div id="finalResult"
     class="box">

  <div id="finalName"
       style="
       font-size:36px;
       font-weight:bold;
       margin-bottom:15px;
       ">
  </div>

  <div id="finalStatus"
       style="
       font-size:25px;
       font-weight:bold;
       ">
  </div>

  <div id="finalBooks"
       style="
       font-size:19px;
       line-height:1.7;
       margin-top:20px;
       text-align:left;
       ">
  </div>

  <div id="resultTime"></div>

</div>



<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyx8L6wf-PMZMQYBd1_ViAUiJ65ByHW4N7_Sq2ItXKbFSOW69MpV6boP81GX_wuiKnt5A/exec";


/* 상태 */

let mode = "student";

let currentStudentCode = "";
let currentStudentName = "";

let borrowedTitles = [];

let locked = false;


/* 카메라 */

let html5QrCode = null;

let cameraRunning = false;

let cameraStarting = false;



/* =========================================
   QR 인식
========================================= */

async function onScanSuccess(decodedText) {

  if (locked) return;

  locked = true;


  const code =
    decodedText.trim().toUpperCase();


  if (mode === "student") {

    await stopCamera();

    await handleStudent(code);

  }

  else if (mode === "book") {

    await stopCamera();

    await handleBook(code);

  }

}



/* =========================================
   카메라 시작
========================================= */

async function startCamera() {

  if (cameraRunning || cameraStarting) {
    return;
  }


  cameraStarting = true;


  const cameraBox =
    document.getElementById("cameraBox");

  const cameraMessage =
    document.getElementById("cameraMessage");

  const restartButton =
    document.getElementById("restartButton");


  cameraBox.style.display =
    "block";

  cameraMessage.style.display =
    "block";

  cameraMessage.innerText =
    "카메라를 실행하는 중입니다.";

  restartButton.style.display =
    "none";


  try {

    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode("reader");

    }


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(

              Math.min(
                250,
                viewfinderWidth * 0.7,
                viewfinderHeight * 0.7
              )

            );


          return {
            width: size,
            height: size
          };

        }
      },

      onScanSuccess,

      function() {
      }

    );


    cameraRunning = true;


    cameraMessage.style.display =
      "none";


    setTimeout(function() {

      const video =
        document.querySelector(
          "#reader video"
        );


      if (video) {

        video.setAttribute(
          "playsinline",
          ""
        );

        video.setAttribute(
          "webkit-playsinline",
          ""
        );

        video.muted = true;

        video.autoplay = true;


        video.play().catch(
          function() {
          }
        );

      }

    }, 300);

  }

  catch (error) {

    console.error(
      "카메라 오류:",
      error
    );


    cameraRunning = false;


    cameraMessage.style.display =
      "block";


    cameraMessage.innerText =
      "카메라를 열 수 없습니다.\n카메라 권한을 확인해주세요.";


    restartButton.style.display =
      "block";

  }

  finally {

    cameraStarting = false;

  }

}



/* =========================================
   카메라 중지
========================================= */

async function stopCamera() {

  if (
    !html5QrCode ||
    !cameraRunning
  ) {

    cameraRunning = false;

    return;

  }


  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.log(error);

  }


  cameraRunning = false;

}



/* =========================================
   카메라 재시작
========================================= */

async function restartCamera() {

  await stopCamera();


  setTimeout(function() {

    startCamera();

  }, 400);

}



/* =========================================
   학생 QR
========================================= */

async function handleStudent(code) {

  document.getElementById("guide").innerText =
    "학생을 확인하고 있습니다...";


  try {

    const response =
      await fetch(

        API_URL +
        "?action=student&code=" +
        encodeURIComponent(code),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    if (!data.success) {

      showStudentError(
        data.message
      );

      return;

    }


    currentStudentCode =
      data.code;

    currentStudentName =
      data.name;

    borrowedTitles = [];


    /*
      학생 확인 완료 후
      바로 책 QR 모드
    */

    mode = "book";

    locked = false;


    document.getElementById("pageTitle").innerText =
      "도서대출";


    document.getElementById("guide").innerText =
      currentStudentName +
      " 학생이 빌릴 책 QR을 보여주세요.";


    setTimeout(function() {

      startCamera();

    }, 500);

  }

  catch (error) {

    showStudentError(
      "학생 정보를 불러오지 못했습니다."
    );

  }

}



/* =========================================
   책 QR
========================================= */

async function handleBook(bookCode) {

  document.getElementById("guide").innerText =
    "책을 확인하고 있습니다...";


  try {

    const response =
      await fetch(

        API_URL +
        "?action=borrow" +

        "&code=" +
        encodeURIComponent(
          currentStudentCode
        ) +

        "&bookCode=" +
        encodeURIComponent(
          bookCode
        ),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    if (!data.success) {

      showBookError(
        data.message
      );

      return;

    }


    if (!data.duplicate) {

      borrowedTitles.push(
        data.title
      );

    }


    document.getElementById("cameraBox").style.display =
      "none";


    document.getElementById("borrowResult").style.display =
      "block";


    document.getElementById("studentName").innerText =
      currentStudentName;


    document.getElementById("status").className =
      "";


    document.getElementById("status").innerText =
      data.duplicate
        ? "이미 대출 처리된 책입니다."
        : "✓ 대출 완료";


    updateBorrowList();


    document.getElementById("guide").innerText =
      "책을 더 빌리거나 대출을 완료하세요.";


    mode = "waiting";

    locked = true;

  }

  catch (error) {

    showBookError(
      "도서대출 처리에 실패했습니다."
    );

  }

}



/* =========================================
   대출 목록
========================================= */

function updateBorrowList() {

  const bookList =
    document.getElementById("bookList");


  if (borrowedTitles.length === 0) {

    bookList.innerHTML =
      "";

    return;

  }


  bookList.innerHTML =

    "<b>오늘 대출한 책</b><br><br>" +

    borrowedTitles
      .map(
        (title, index) =>
          (index + 1) +
          ". 📖 " +
          title
      )
      .join("<br>");

}



/* =========================================
   더 대출하기
========================================= */

async function borrowMore() {

  document.getElementById("borrowResult").style.display =
    "none";

  document.getElementById("checkoutConfirm").style.display =
    "none";


  document.getElementById("cameraBox").style.display =
    "block";


  document.getElementById("pageTitle").innerText =
    "도서대출";


  document.getElementById("guide").innerText =
    currentStudentName +
    " 학생이 빌릴 책 QR을 보여주세요.";


  mode = "book";

  locked = false;


  setTimeout(function() {

    startCamera();

  }, 500);

}



/* =========================================
   대출 완료
========================================= */

function finishBorrow() {

  document.getElementById("borrowResult").style.display =
    "none";


  document.getElementById("checkoutConfirm").style.display =
    "block";


  document.getElementById("resultName").innerText =
    currentStudentName;


  const list =
    document.getElementById(
      "confirmBookList"
    );


  if (borrowedTitles.length > 0) {

    list.innerHTML =

      "<b>대출한 책</b><br><br>" +

      borrowedTitles
        .map(
          (title, index) =>
            (index + 1) +
            ". 📖 " +
            title
        )
        .join("<br>");

  }

  else {

    list.innerHTML = "";

  }


  document.getElementById("guide").innerText =
    "대출이 완료되었습니다.";

}



/* =========================================
   하원
========================================= */

async function checkoutStudent() {

  document.getElementById("checkoutConfirm").style.display =
    "none";


  document.getElementById("finalResult").style.display =
    "block";


  document.getElementById("finalName").innerText =
    currentStudentName;


  document.getElementById("finalStatus").innerText =
    "하원 처리 중...";


  document.getElementById("guide").innerText =
    "잠시만 기다려주세요.";


  try {

    const response =
      await fetch(

        API_URL +
        "?action=checkout&code=" +
        encodeURIComponent(
          currentStudentCode
        ),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();


    if (!data.success) {

      document.getElementById("finalStatus").className =
        "error";

      document.getElementById("finalStatus").innerText =
        data.message ||
        "하원 처리에 실패했습니다.";

      return;

    }


    document.getElementById("finalStatus").className =
      "";


    document.getElementById("finalStatus").innerText =
      data.duplicate
        ? "이미 오늘 하원했습니다."
        : "✓ 하원 완료";


    if (
      data.books &&
      data.books.length > 0
    ) {

      document.getElementById("finalBooks").innerHTML =

        "<b>오늘 대출한 책</b><br><br>" +

        data.books
          .map(
            title =>
              "📖 " + title
          )
          .join("<br>");

    }

    else {

      document.getElementById("finalBooks").innerHTML =
        "";

    }


    document.getElementById("resultTime").innerText =
      "하원시간 " + data.time;


    document.getElementById("guide").innerText =
      "하원이 완료되었습니다.";


    /*
      ★ 중요 ★

      엄마에게 문자를 보내는 기능은
      여기 HTML에서 직접 보내는 것이 아니라

      Google Apps Script의
      action=checkout 처리 안에서

      문자 발송 API를 실행해야 함.

      즉,
      '네, 하원합니다'
      버튼을 누르면

      action=checkout

      이 호출되므로

      Apps Script에서
      이 시점에 문자를 발송하면 됨.
    */


    setTimeout(
      resetAll,
      5000
    );

  }

  catch (error) {

    document.getElementById("finalStatus").className =
      "error";


    document.getElementById("finalStatus").innerText =
      "하원 처리에 실패했습니다.";

  }

}



/* =========================================
   학생 QR 오류
========================================= */

function showStudentError(message) {

  document.getElementById("cameraBox").style.display =
    "none";


  document.getElementById("finalResult").style.display =
    "block";


  document.getElementById("finalName").innerText =
    "";


  document.getElementById("finalStatus").className =
    "error";


  document.getElementById("finalStatus").innerText =
    message || "학생을 찾을 수 없습니다.";


  setTimeout(
    resetAll,
    3000
  );

}



/* =========================================
   책 QR 오류
========================================= */

function showBookError(message) {

  document.getElementById("cameraBox").style.display =
    "none";


  document.getElementById("borrowResult").style.display =
    "block";


  document.getElementById("studentName").innerText =
    currentStudentName;


  document.getElementById("status").className =
    "error";


  document.getElementById("status").innerText =
    message || "책을 찾을 수 없습니다.";


  updateBorrowList();


  mode = "waiting";

  locked = true;

}



/* =========================================
   처음으로
========================================= */

async function resetAll() {

  await stopCamera();


  mode = "student";

  currentStudentCode = "";

  currentStudentName = "";

  borrowedTitles = [];

  locked = false;


  document.getElementById("pageTitle").innerText =
    "도서대출";


  document.getElementById("guide").innerText =
    "학생 QR을 보여주세요.";


  document.getElementById("borrowResult").style.display =
    "none";


  document.getElementById("checkoutConfirm").style.display =
    "none";


  document.getElementById("finalResult").style.display =
    "none";


  document.getElementById("finalStatus").className =
    "";


  document.getElementById("finalBooks").innerHTML =
    "";


  document.getElementById("resultTime").innerText =
    "";


  document.getElementById("cameraBox").style.display =
    "block";


  setTimeout(function() {

    startCamera();

  }, 400);

}



/* =========================================
   첫 실행
========================================= */

window.addEventListener(
  "load",
  function() {

    setTimeout(function() {

      startCamera();

    }, 400);

  }
);



/* =========================================
   아이폰 Safari 복구
========================================= */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState === "visible" &&
      (
        mode === "student" ||
        mode === "book"
      )
    ) {

      setTimeout(function() {

        if (!cameraRunning) {

          startCamera();

        }

      }, 600);

    }

  }
);

</script>

</body>
</html>
