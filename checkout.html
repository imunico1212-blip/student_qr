<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      user-scalable=no">

<title>학생 하원</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: -apple-system,
               BlinkMacSystemFont,
               sans-serif;

  margin: 0;
  padding: 25px 18px;

  text-align: center;

  background: #f7f7f7;
}


h1 {
  font-size: 32px;
  margin-bottom: 8px;
}


#guide {
  font-size: 19px;
  margin-bottom: 20px;
}


#reader {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
}


#studentBox,
#result {

  display: none;

  max-width: 450px;

  margin: 24px auto;

  padding: 28px 20px;

  background: white;

  border-radius: 18px;
}


#studentName {

  font-size: 38px;

  font-weight: bold;

  margin-bottom: 20px;
}


button {

  display: block;

  width: 100%;

  padding: 18px;

  margin: 12px 0;

  border: 0;

  border-radius: 14px;

  font-size: 23px;

  font-weight: bold;

  cursor: pointer;
}


#borrowButton {
  background: #e8f1ff;
}


#checkoutButton {
  background: #ededed;
}


#cancelButton {
  background: #f5f5f5;
  font-size: 18px;
}


#resultName {

  font-size: 38px;

  font-weight: bold;

  margin-bottom: 12px;
}


#resultStatus {

  font-size: 24px;

  font-weight: bold;
}


#bookTitle {

  margin-top: 15px;

  font-size: 22px;
}


#resultTime {

  margin-top: 12px;

  font-size: 19px;
}


.error {
  color: #b00020;
}

</style>

</head>


<body>

<h1 id="pageTitle">하원</h1>

<div id="guide">
  학생 QR을 보여주세요.
</div>


<div id="reader"></div>


<div id="studentBox">

  <div id="studentName"></div>

  <button id="borrowButton"
          onclick="startBookMode()">
    📚 책 빌리기
  </button>

  <button id="checkoutButton"
          onclick="checkoutOnly()">
    🏠 그냥 하원
  </button>

  <button id="cancelButton"
          onclick="resetScanner()">
    취소
  </button>

</div>


<div id="result">

  <div id="resultName"></div>

  <div id="resultStatus"></div>

  <div id="bookTitle"></div>

  <div id="resultTime"></div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyx8L6wf-PMZMQYBd1_ViAUiJ65ByHW4N7_Sq2ItXKbFSOW69MpV6boP81GX_wuiKnt5A/exec";


let mode = "student";

let currentStudentCode = "";

let currentStudentName = "";

let locked = false;


function onScanSuccess(decodedText) {

  if (locked) return;

  locked = true;

  const code =
    decodedText.trim().toUpperCase();


  if (mode === "student") {

    handleStudent(code);

  } else if (mode === "book") {

    handleBook(code);

  }
}


// --------------------------------------------------
// 학생 QR
// --------------------------------------------------

async function handleStudent(code) {

  document.getElementById("guide").innerText =
    "학생 확인 중...";

  try {

    const response = await fetch(

      API_URL +
      "?action=student&code=" +
      encodeURIComponent(code)

    );

    const data = await response.json();


    if (!data.success) {

      showError(data.message);

      return;

    }


    currentStudentCode =
      data.code;

    currentStudentName =
      data.name;


    document.getElementById("reader").style.display =
      "none";


    document.getElementById("studentBox").style.display =
      "block";


    document.getElementById("studentName").innerText =
      data.name;


    document.getElementById("guide").innerText =
      "하원 방법을 선택하세요.";


  } catch (error) {

    showError(
      "학생 정보를 불러오지 못했습니다."
    );

  }

}


// --------------------------------------------------
// 그냥 하원
// --------------------------------------------------

async function checkoutOnly() {

  document.getElementById("studentBox").style.display =
    "none";


  showProcessing(
    currentStudentName,
    "하원 처리 중..."
  );


  try {

    const response = await fetch(

      API_URL +
      "?action=checkout&code=" +
      encodeURIComponent(currentStudentCode)

    );


    const data =
      await response.json();


    if (!data.success) {

      showError(data.message);

      return;

    }


    showResult(
      data.name,
      data.duplicate
        ? "이미 오늘 하원했습니다."
        : "✓ 하원 완료",
      "",
      data.time
    );


  } catch (error) {

    showError(
      "하원 처리에 실패했습니다."
    );

  }

}


// --------------------------------------------------
// 책 대출 모드
// --------------------------------------------------

function startBookMode() {

  mode = "book";

  locked = false;


  document.getElementById("studentBox").style.display =
    "none";


  document.getElementById("reader").style.display =
    "block";


  document.getElementById("pageTitle").innerText =
    "책 대출";


  document.getElementById("guide").innerText =
    currentStudentName +
    " 학생이 빌릴 책의 QR을 보여주세요.";
}


// --------------------------------------------------
// 책 QR
// --------------------------------------------------

async function handleBook(bookCode) {

  document.getElementById("guide").innerText =
    "책 정보를 확인하고 있습니다...";


  try {

    const response = await fetch(

      API_URL +
      "?action=borrowCheckout" +
      "&code=" +
      encodeURIComponent(currentStudentCode) +
      "&bookCode=" +
      encodeURIComponent(bookCode)

    );


    const data =
      await response.json();


    if (!data.success) {

      if (data.alreadyCheckout) {

        showResult(
          data.name,
          "이미 오늘 하원했습니다.",
          "",
          data.time
        );

        return;
      }


      showError(data.message);

      return;
    }


    showResult(
      data.name,
      "✓ 대출 및 하원 완료",
      "📖 " + data.title,
      data.time
    );


  } catch (error) {

    showError(
      "대출 처리에 실패했습니다."
    );

  }

}


// --------------------------------------------------
// 처리 중 표시
// --------------------------------------------------

function showProcessing(name, text) {

  document.getElementById("reader").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";

  document.getElementById("resultName").innerText =
    name;

  document.getElementById("resultStatus").innerText =
    text;

  document.getElementById("bookTitle").innerText =
    "";

  document.getElementById("resultTime").innerText =
    "";
}


// --------------------------------------------------
// 결과 표시
// --------------------------------------------------

function showResult(
  name,
  status,
  book,
  time
) {

  document.getElementById("reader").style.display =
    "none";

  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";


  document.getElementById("resultName").innerText =
    name;


  document.getElementById("resultStatus").className =
    "";


  document.getElementById("resultStatus").innerText =
    status;


  document.getElementById("bookTitle").innerText =
    book || "";


  document.getElementById("resultTime").innerText =
    time ? "하원시간 " + time : "";


  setTimeout(
    resetScanner,
    4000
  );
}


// --------------------------------------------------
// 오류
// --------------------------------------------------

function showError(message) {

  document.getElementById("reader").style.display =
    "none";

  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";


  document.getElementById("resultName").innerText =
    "";


  document.getElementById("resultStatus").className =
    "error";


  document.getElementById("resultStatus").innerText =
    message;


  document.getElementById("bookTitle").innerText =
    "";


  document.getElementById("resultTime").innerText =
    "";


  setTimeout(
    resetScanner,
    3500
  );
}


// --------------------------------------------------
// 초기화
// --------------------------------------------------

function resetScanner() {

  mode = "student";

  currentStudentCode = "";

  currentStudentName = "";

  locked = false;


  document.getElementById("pageTitle").innerText =
    "하원";


  document.getElementById("guide").innerText =
    "학생 QR을 보여주세요.";


  document.getElementById("reader").style.display =
    "block";


  document.getElementById("studentBox").style.display =
    "none";


  document.getElementById("result").style.display =
    "none";


  document.getElementById("resultStatus").className =
    "";
}


// --------------------------------------------------
// QR 스캐너
// --------------------------------------------------

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    false
  );


scanner.render(onScanSuccess);

</script>

</body>

</html>
