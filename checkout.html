<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover">

  <title>학생 하원</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        sans-serif;

      margin: 0;
      padding: 25px 18px;

      text-align: center;
      background: #f7f7f7;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 8px;
    }

    #guide {
      font-size: 19px;
      margin-bottom: 20px;
    }

    /* -------------------------
       카메라
    ------------------------- */

    #cameraBox {
      width: 100%;
      max-width: 500px;
      height: 360px;

      margin: 0 auto;

      position: relative;

      background: #000;

      border-radius: 18px;

      overflow: hidden;
    }

    #reader {
      width: 100%;
      height: 100%;
      background: #000;
    }

    #reader video {
      width: 100% !important;
      height: 360px !important;

      object-fit: cover !important;

      display: block !important;

      background: #000;
    }

    #cameraMessage {
      position: absolute;

      top: 50%;
      left: 20px;
      right: 20px;

      transform: translateY(-50%);

      color: white;

      font-size: 18px;

      z-index: 10;

      pointer-events: none;

      white-space: pre-line;
    }

    #restartButton {
      display: none;

      max-width: 500px;

      margin: 18px auto 0;

      background: #222;
      color: white;
    }


    /* -------------------------
       학생 / 결과
    ------------------------- */

    #studentBox,
    #result {
      display: none;

      max-width: 450px;

      margin: 24px auto;

      padding: 28px 20px;

      background: white;

      border-radius: 18px;
    }

    #studentName,
    #resultName {
      font-size: 38px;
      font-weight: bold;

      margin-bottom: 20px;
    }

    button {
      display: block;

      width: 100%;

      padding: 18px;

      margin: 12px 0;

      border: 0;
      border-radius: 14px;

      font-size: 23px;
      font-weight: bold;

      cursor: pointer;
    }

    #borrowButton,
    #moreBorrowButton {
      background: #e8f1ff;
    }

    #checkoutButton,
    #finishCheckoutButton {
      background: #ededed;
    }

    #status {
      font-size: 24px;
      font-weight: bold;
    }

    #bookList {
      margin-top: 15px;

      font-size: 20px;

      line-height: 1.6;
    }

    #resultTime {
      margin-top: 12px;

      font-size: 19px;
    }

    .error {
      color: #b00020;
    }
  </style>
</head>


<body>

<h1 id="pageTitle">하원</h1>

<div id="guide">
  학생 QR을 보여주세요.
</div>


<div id="cameraBox">

  <div id="cameraMessage">
    카메라를 실행하는 중입니다.
  </div>

  <div id="reader"></div>

</div>


<button id="restartButton"
        onclick="restartCamera()">
  카메라 다시 켜기
</button>



<div id="studentBox">

  <div id="studentName"></div>

  <button id="checkoutButton"
          onclick="checkoutStudent()">
    🏠 하원
  </button>

  <button id="borrowButton"
          onclick="startBookMode()">
    📚 도서대출
  </button>

</div>



<div id="result">

  <div id="resultName"></div>

  <div id="status"></div>

  <div id="bookList"></div>

  <div id="resultTime"></div>

  <button id="moreBorrowButton"
          style="display:none"
          onclick="startBookMode()">
    📚 더 대출하기
  </button>

  <button id="finishCheckoutButton"
          style="display:none"
          onclick="checkoutStudent()">
    🏠 하원하기
  </button>

</div>



<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyx8L6wf-PMZMQYBd1_ViAUiJ65ByHW4N7_Sq2ItXKbFSOW69MpV6boP81GX_wuiKnt5A/exec";


let mode = "student";

let currentStudentCode = "";
let currentStudentName = "";

let locked = false;

let borrowedTitles = [];


/* -------------------------
   카메라 상태
------------------------- */

let html5QrCode = null;

let cameraRunning = false;

let cameraStarting = false;



/* ==================================================
   QR 인식
================================================== */

function onScanSuccess(decodedText) {

  if (locked) return;

  const code =
    decodedText.trim().toUpperCase();


  if (mode === "student") {

    locked = true;

    stopCamera();

    handleStudent(code);

  }

  else if (mode === "book") {

    locked = true;

    stopCamera();

    handleBook(code);

  }

}



/* ==================================================
   카메라 시작
================================================== */

async function startCamera() {

  if (cameraRunning || cameraStarting) {
    return;
  }


  cameraStarting = true;


  const cameraBox =
    document.getElementById("cameraBox");

  const cameraMessage =
    document.getElementById("cameraMessage");

  const restartButton =
    document.getElementById("restartButton");


  cameraBox.style.display =
    "block";

  cameraMessage.style.display =
    "block";

  cameraMessage.innerText =
    "카메라를 실행하는 중입니다.";

  restartButton.style.display =
    "none";


  try {

    if (!html5QrCode) {

      html5QrCode =
        new Html5Qrcode("reader");

    }


    await html5QrCode.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(

              Math.min(
                250,
                viewfinderWidth * 0.7,
                viewfinderHeight * 0.7
              )

            );


          return {

            width: size,
            height: size

          };

        },

        disableFlip: false
      },

      onScanSuccess,

      function() {
        /* QR 미인식은 정상 상태 */
      }

    );


    cameraRunning = true;

    cameraMessage.style.display =
      "none";


    /*
      iPhone Safari 대응
    */

    setTimeout(function() {

      const video =
        document.querySelector(
          "#reader video"
        );


      if (video) {

        video.setAttribute(
          "playsinline",
          ""
        );

        video.setAttribute(
          "webkit-playsinline",
          ""
        );

        video.muted = true;

        video.autoplay = true;


        video.play().catch(
          function() {
          }
        );

      }

    }, 300);

  }

  catch (error) {

    console.error(
      "카메라 실행 오류:",
      error
    );


    cameraRunning = false;


    cameraMessage.style.display =
      "block";

    cameraMessage.innerText =
      "카메라를 열 수 없습니다.\n카메라 권한을 확인해주세요.";

    restartButton.style.display =
      "block";

  }

  finally {

    cameraStarting = false;

  }

}



/* ==================================================
   카메라 정지
================================================== */

async function stopCamera() {

  if (
    !html5QrCode ||
    !cameraRunning
  ) {

    return;

  }


  try {

    await html5QrCode.stop();

  }

  catch (error) {

    console.log(
      "카메라 정지:",
      error
    );

  }


  cameraRunning = false;

}



/* ==================================================
   카메라 재시작
================================================== */

async function restartCamera() {

  await stopCamera();


  setTimeout(function() {

    startCamera();

  }, 400);

}



/* ==================================================
   학생 QR
================================================== */

async function handleStudent(code) {

  document.getElementById("guide").innerText =
    "학생 확인 중...";


  try {

    const response =
      await fetch(

        API_URL +
        "?action=student&code=" +
        encodeURIComponent(code),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();



    if (!data.success) {

      showError(data.message);

      return;

    }



    currentStudentCode =
      data.code;

    currentStudentName =
      data.name;

    borrowedTitles = [];

    mode = "menu";


    document.getElementById("cameraBox").style.display =
      "none";

    document.getElementById("restartButton").style.display =
      "none";

    document.getElementById("result").style.display =
      "none";

    document.getElementById("studentBox").style.display =
      "block";


    document.getElementById("studentName").innerText =
      data.name;


    document.getElementById("guide").innerText =
      "원하는 항목을 선택하세요.";

  }

  catch (error) {

    showError(
      "학생 정보를 불러오지 못했습니다."
    );

  }

}



/* ==================================================
   도서대출 버튼
================================================== */

async function startBookMode() {

  mode = "book";

  locked = false;


  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "none";


  document.getElementById("pageTitle").innerText =
    "도서대출";


  document.getElementById("guide").innerText =
    currentStudentName +
    " 학생이 빌릴 책 QR을 보여주세요.";


  document.getElementById("cameraBox").style.display =
    "block";


  await startCamera();

}



/* ==================================================
   책 QR
================================================== */

async function handleBook(bookCode) {

  document.getElementById("guide").innerText =
    "책 정보를 확인하고 있습니다...";


  try {

    const response =
      await fetch(

        API_URL +
        "?action=borrow" +
        "&code=" +
        encodeURIComponent(
          currentStudentCode
        ) +
        "&bookCode=" +
        encodeURIComponent(
          bookCode
        ),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();



    if (!data.success) {

      showError(data.message);

      return;

    }



    if (!data.duplicate) {

      borrowedTitles.push(
        data.title
      );

    }


    mode = "menu";

    locked = true;


    document.getElementById("cameraBox").style.display =
      "none";

    document.getElementById("restartButton").style.display =
      "none";

    document.getElementById("studentBox").style.display =
      "none";

    document.getElementById("result").style.display =
      "block";


    document.getElementById("resultName").innerText =
      currentStudentName;


    document.getElementById("status").className =
      "";


    document.getElementById("status").innerText =
      data.duplicate
        ? "이미 대출 처리된 책입니다."
        : "✓ 대출 완료";


    document.getElementById("bookList").innerHTML =
      "📖 " + data.title;


    document.getElementById("resultTime").innerText =
      "";


    document.getElementById("moreBorrowButton").style.display =
      "block";


    document.getElementById("finishCheckoutButton").style.display =
      "block";


    document.getElementById("guide").innerText =
      "다음 작업을 선택하세요.";

  }

  catch (error) {

    showError(
      "도서대출 처리에 실패했습니다."
    );

  }

}



/* ==================================================
   하원
================================================== */

async function checkoutStudent() {

  locked = true;

  mode = "menu";


  await stopCamera();


  document.getElementById("cameraBox").style.display =
    "none";

  document.getElementById("restartButton").style.display =
    "none";

  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";


  document.getElementById("resultName").innerText =
    currentStudentName;


  document.getElementById("status").className =
    "";


  document.getElementById("status").innerText =
    "하원 처리 중...";


  document.getElementById("bookList").innerText =
    "";


  document.getElementById("resultTime").innerText =
    "";


  document.getElementById("moreBorrowButton").style.display =
    "none";


  document.getElementById("finishCheckoutButton").style.display =
    "none";


  try {

    const response =
      await fetch(

        API_URL +
        "?action=checkout&code=" +
        encodeURIComponent(
          currentStudentCode
        ),

        {
          cache: "no-store"
        }

      );


    const data =
      await response.json();



    if (!data.success) {

      showError(data.message);

      return;

    }



    document.getElementById("status").innerText =
      data.duplicate
        ? "이미 오늘 하원했습니다."
        : "✓ 하원 완료";


    if (
      data.books &&
      data.books.length > 0
    ) {

      document.getElementById("bookList").innerHTML =

        "오늘 대출한 책<br><br>" +

        data.books
          .map(
            title => "📖 " + title
          )
          .join("<br>");

    }

    else {

      document.getElementById("bookList").innerText =
        "";

    }


    document.getElementById("resultTime").innerText =
      "하원시간 " + data.time;


    setTimeout(
      resetAll,
      4500
    );

  }

  catch (error) {

    showError(
      "하원 처리에 실패했습니다."
    );

  }

}



/* ==================================================
   오류
================================================== */

function showError(message) {

  mode = "menu";

  locked = true;


  stopCamera();


  document.getElementById("cameraBox").style.display =
    "none";

  document.getElementById("restartButton").style.display =
    "none";

  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";


  document.getElementById("resultName").innerText =
    currentStudentName || "";


  document.getElementById("status").className =
    "error";


  document.getElementById("status").innerText =
    message || "오류가 발생했습니다.";


  document.getElementById("bookList").innerText =
    "";


  document.getElementById("resultTime").innerText =
    "";


  if (currentStudentCode) {

    document.getElementById("moreBorrowButton").style.display =
      "block";

    document.getElementById("finishCheckoutButton").style.display =
      "block";

  }

  else {

    document.getElementById("moreBorrowButton").style.display =
      "none";

    document.getElementById("finishCheckoutButton").style.display =
      "none";


    setTimeout(
      resetAll,
      3500
    );

  }

}



/* ==================================================
   다음 학생 준비
================================================== */

async function resetAll() {

  await stopCamera();


  mode = "student";

  currentStudentCode = "";

  currentStudentName = "";

  borrowedTitles = [];

  locked = false;


  document.getElementById("pageTitle").innerText =
    "하원";


  document.getElementById("guide").innerText =
    "학생 QR을 보여주세요.";


  document.getElementById("studentBox").style.display =
    "none";


  document.getElementById("result").style.display =
    "none";


  document.getElementById("status").className =
    "";


  document.getElementById("moreBorrowButton").style.display =
    "none";


  document.getElementById("finishCheckoutButton").style.display =
    "none";


  document.getElementById("cameraBox").style.display =
    "block";


  setTimeout(function() {

    startCamera();

  }, 350);

}



/* ==================================================
   처음 페이지 실행
================================================== */

window.addEventListener(
  "load",
  function() {

    setTimeout(function() {

      startCamera();

    }, 400);

  }
);



/* ==================================================
   아이폰 Safari
   다른 앱 갔다 돌아왔을 때
================================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible" &&
      (
        mode === "student" ||
        mode === "book"
      )
    ) {

      setTimeout(function() {

        if (!cameraRunning) {

          startCamera();

          return;

        }


        const video =
          document.querySelector(
            "#reader video"
          );


        if (video) {

          video.setAttribute(
            "playsinline",
            ""
          );

          video.muted = true;


          video.play().catch(
            function() {

              restartCamera();

            }
          );

        }

        else {

          restartCamera();

        }

      }, 600);

    }

  }
);

</script>

</body>
</html>
