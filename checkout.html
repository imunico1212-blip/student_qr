<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      user-scalable=no">

<title>학생 하원</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body {
  font-family: -apple-system,
               BlinkMacSystemFont,
               sans-serif;

  margin: 0;
  padding: 25px 18px;

  text-align: center;
  background: #f7f7f7;
}

h1 {
  font-size: 32px;
  margin-bottom: 8px;
}

#guide {
  font-size: 19px;
  margin-bottom: 20px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: auto;
  background: white;
}

#studentBox,
#result {

  display: none;

  max-width: 450px;

  margin: 24px auto;
  padding: 28px 20px;

  background: white;
  border-radius: 18px;
}

#studentName,
#resultName {

  font-size: 38px;
  font-weight: bold;

  margin-bottom: 20px;
}

button {

  display: block;

  width: 100%;

  padding: 18px;

  margin: 12px 0;

  border: 0;
  border-radius: 14px;

  font-size: 23px;
  font-weight: bold;
}

#borrowButton {
  background: #e8f1ff;
}

#checkoutButton {
  background: #ededed;
}

#status {
  font-size: 24px;
  font-weight: bold;
}

#bookList {
  margin-top: 15px;
  font-size: 20px;
  line-height: 1.6;
}

#resultTime {
  margin-top: 12px;
  font-size: 19px;
}

.error {
  color: #b00020;
}

</style>

</head>


<body>

<h1 id="pageTitle">하원</h1>

<div id="guide">
  학생 QR을 보여주세요.
</div>

<div id="reader"></div>


<div id="studentBox">

  <div id="studentName"></div>

  <button id="checkoutButton"
          onclick="checkoutStudent()">
    🏠 하원
  </button>

  <button id="borrowButton"
          onclick="startBookMode()">
    📚 도서대출
  </button>

</div>


<div id="result">

  <div id="resultName"></div>

  <div id="status"></div>

  <div id="bookList"></div>

  <div id="resultTime"></div>

  <button id="continueCheckout"
          style="display:none"
          onclick="showStudentButtons()">
    돌아가기
  </button>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyx8L6wf-PMZMQYBd1_ViAUiJ65ByHW4N7_Sq2ItXKbFSOW69MpV6boP81GX_wuiKnt5A/exec";


let mode = "student";

let currentStudentCode = "";
let currentStudentName = "";

let locked = false;

let borrowedTitles = [];


// --------------------------------------------------
// QR 인식
// --------------------------------------------------

function onScanSuccess(decodedText) {

  if (locked) return;

  locked = true;

  const code =
    decodedText.trim().toUpperCase();

  if (mode === "student") {
    handleStudent(code);
  }

  else if (mode === "book") {
    handleBook(code);
  }
}


// --------------------------------------------------
// 학생 QR
// --------------------------------------------------

async function handleStudent(code) {

  document.getElementById("guide").innerText =
    "학생 확인 중...";

  try {

    const response = await fetch(
      API_URL +
      "?action=student&code=" +
      encodeURIComponent(code)
    );

    const data =
      await response.json();

    if (!data.success) {
      showError(data.message);
      return;
    }

    currentStudentCode =
      data.code;

    currentStudentName =
      data.name;

    borrowedTitles = [];

    document.getElementById("reader").style.display =
      "none";

    document.getElementById("studentBox").style.display =
      "block";

    document.getElementById("studentName").innerText =
      data.name;

    document.getElementById("guide").innerText =
      "원하는 항목을 선택하세요.";

  } catch (error) {

    showError(
      "학생 정보를 불러오지 못했습니다."
    );
  }
}


// --------------------------------------------------
// 도서대출 버튼
// --------------------------------------------------

function startBookMode() {

  mode = "book";
  locked = false;

  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "none";

  document.getElementById("reader").style.display =
    "block";

  document.getElementById("pageTitle").innerText =
    "도서대출";

  document.getElementById("guide").innerText =
    currentStudentName +
    " 학생이 빌릴 책 QR을 보여주세요.";
}


// --------------------------------------------------
// 책 QR
// --------------------------------------------------

async function handleBook(bookCode) {

  document.getElementById("guide").innerText =
    "책 정보를 확인하고 있습니다...";

  try {

    const response = await fetch(

      API_URL +
      "?action=borrow" +
      "&code=" +
      encodeURIComponent(currentStudentCode) +
      "&bookCode=" +
      encodeURIComponent(bookCode)

    );

    const data =
      await response.json();

    if (!data.success) {
      showError(data.message);
      return;
    }

    if (!data.duplicate) {
      borrowedTitles.push(data.title);
    }

    document.getElementById("reader").style.display =
      "none";

    document.getElementById("result").style.display =
      "block";

    document.getElementById("resultName").innerText =
      currentStudentName;

    document.getElementById("status").className = "";

    document.getElementById("status").innerText =
      data.duplicate
        ? "이미 대출 처리된 책입니다."
        : "✓ 대출 완료";

    document.getElementById("bookList").innerText =
      "📖 " + data.title;

    document.getElementById("resultTime").innerText =
      "";

    document.getElementById("continueCheckout").style.display =
      "block";

  } catch (error) {

    showError(
      "도서대출 처리에 실패했습니다."
    );
  }
}


// --------------------------------------------------
// 다시 하원 / 도서대출 버튼
// --------------------------------------------------

function showStudentButtons() {

  mode = "student";
  locked = false;

  document.getElementById("pageTitle").innerText =
    "하원";

  document.getElementById("guide").innerText =
    "다음 작업을 선택하세요.";

  document.getElementById("reader").style.display =
    "none";

  document.getElementById("result").style.display =
    "none";

  document.getElementById("studentBox").style.display =
    "block";
}


// --------------------------------------------------
// 하원 버튼
// --------------------------------------------------

async function checkoutStudent() {

  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";

  document.getElementById("resultName").innerText =
    currentStudentName;

  document.getElementById("status").innerText =
    "하원 처리 중...";

  document.getElementById("bookList").innerText =
    "";

  document.getElementById("resultTime").innerText =
    "";

  document.getElementById("continueCheckout").style.display =
    "none";


  try {

    const response = await fetch(

      API_URL +
      "?action=checkout&code=" +
      encodeURIComponent(currentStudentCode)

    );

    const data =
      await response.json();

    if (!data.success) {
      showError(data.message);
      return;
    }

    document.getElementById("status").innerText =
      data.duplicate
        ? "이미 오늘 하원했습니다."
        : "✓ 하원 완료";

    if (data.books && data.books.length > 0) {

      document.getElementById("bookList").innerHTML =
        "오늘 대출한 책<br>" +
        data.books.map(
          title => "📖 " + title
        ).join("<br>");

    } else {

      document.getElementById("bookList").innerText =
        "";
    }

    document.getElementById("resultTime").innerText =
      "하원시간 " + data.time;

    // 나중에 이 지점에서 솔라피 문자 발송
    // data.books 배열을 그대로 문자에 사용 가능

    setTimeout(
      resetAll,
      4500
    );

  } catch (error) {

    showError(
      "하원 처리에 실패했습니다."
    );
  }
}


// --------------------------------------------------
// 오류
// --------------------------------------------------

function showError(message) {

  document.getElementById("reader").style.display =
    "none";

  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "block";

  document.getElementById("resultName").innerText =
    "";

  document.getElementById("status").className =
    "error";

  document.getElementById("status").innerText =
    message;

  document.getElementById("bookList").innerText =
    "";

  document.getElementById("resultTime").innerText =
    "";

  document.getElementById("continueCheckout").style.display =
    "none";

  setTimeout(
    resetAll,
    3500
  );
}


// --------------------------------------------------
// 완전 초기화
// --------------------------------------------------

function resetAll() {

  mode = "student";

  currentStudentCode = "";
  currentStudentName = "";

  borrowedTitles = [];

  locked = false;

  document.getElementById("pageTitle").innerText =
    "하원";

  document.getElementById("guide").innerText =
    "학생 QR을 보여주세요.";

  document.getElementById("reader").style.display =
    "block";

  document.getElementById("studentBox").style.display =
    "none";

  document.getElementById("result").style.display =
    "none";

  document.getElementById("status").className =
    "";
}


// --------------------------------------------------
// QR 스캐너
// --------------------------------------------------

const scanner =
  new Html5QrcodeScanner(

    "reader",

    {

      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }

    },

    false

  );

scanner.render(onScanSuccess);

</script>

</body>
</html>
